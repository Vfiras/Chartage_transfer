name: dhc_transport
description: DHC Transport admin and driver Flutter app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.2
  image_picker: ^1.0.7
  intl: ^0.20.2
  # Favourite "Memories" photos are copied out of the picker's cache into the
  # app documents directory so the OS cannot evict them.
  path_provider: ^2.1.5
  shared_preferences: ^2.3.0
  speech_to_text: ^7.0.0
  # Background-polled local notifications (see core/services/push_notification_service.dart).
  # Declared now so the foundation is in place; not wired into main() yet.
  flutter_local_notifications: ^17.2.4
  # 0.5.x fails to compile against this project's Kotlin/AGP toolchain
  # (:workmanager:compileDebugKotlin); 0.10.x is the maintained line.
  workmanager: ^0.10.0
  google_maps_flutter: ^2.9.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/fleet/
    - assets/images/partners/
    - assets/data/
